name: Public Linux release build

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  linux:
    # Public standard x64 runners provide 16 GiB; verify resources before work.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=2048
      GRADLE_OPTS: -Dorg.gradle.workers.max=2 -Dorg.gradle.daemon=false
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require a complete reviewed build pin and hosted resources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util, pathlib, shutil
          spec = importlib.util.spec_from_file_location('build_import', 'scripts/import-beholdd-build.py')
          helper = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(helper)
          helper.validate_config(helper.document(pathlib.Path('releases/beholdd-build.json').read_bytes()),
                                 helper.document(pathlib.Path('scripts/deps.json').read_bytes()))
          memory = {line.split(':')[0]: int(line.split()[1]) * 1024
                    for line in pathlib.Path('/proc/meminfo').read_text().splitlines() if line.startswith(('MemTotal:', 'MemAvailable:'))}
          if memory['MemTotal'] < 14 * 1024**3 or memory['MemAvailable'] < 11 * 1024**3:
              raise SystemExit('Need a 16 GiB hosted runner with at least 11 GiB currently available; no build started.')
          if shutil.disk_usage('.').free < 12 * 1024**3:
              raise SystemExit('Need at least 12 GiB free disk; no build started.')
          PY
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          docker info >/dev/null
      - name: Test the public build importer
        run: python3 -m unittest discover -s tools -p test_import_beholdd_build.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.20.0'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android SDK and Linux runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          python3 -c 'print("y\n" * 100)' | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" 'platforms;android-36.1' 'build-tools;36.1.0'
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgtk-3-0 libnss3 libasound2 libgbm1 libxss1 libatk-bridge2.0-0 libvulkan1
      - name: Import only the reviewed public Beholdd archive
        run: python3 scripts/import-beholdd-build.py --work-dir "$RUNNER_TEMP/beholdd-import"
      - name: Verify companion payloads and import pinned Vulkan compatibility runtime
        shell: bash
        run: |
          set -euo pipefail
          node scripts/sync-deps.mjs --verify beholdd beholdd-hag displacer
          node scripts/sync-llama-vulkan.mjs
          node scripts/sync-llama-vulkan.mjs --verify
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Build the isolated desktop release and test unsigned Android
        # release:linux disables npm lifecycle compilers; native compilation uses
        # the mandatory bounded 3 GiB Docker build and verified receipt.
        shell: bash
        run: |
          set -euo pipefail
          export ANTIMATTER_DOOM_RUNTIME="$RUNNER_TEMP/antimatter-doom"
          node scripts/sync-doom-runtime.mjs --output "$ANTIMATTER_DOOM_RUNTIME"
          node scripts/sync-doom-runtime.mjs --output "$ANTIMATTER_DOOM_RUNTIME" --verify-only
          npm run release:linux -- --desktop-only
      - name: Exercise the real updater and installer in a private profile
        shell: bash
        run: |
          set -euo pipefail
          # The outer checkout needs only esbuild for this smoke. The isolated
          # release already ran allowlisted setup scripts and qualified native code.
          npm ci --include=dev --ignore-scripts --no-audit --no-fund
          node scripts/smoke-current-release-update.mjs --report "$RUNNER_TEMP/updater-verification.json"
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Retain verified desktop release assets for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: antimatter-desktop-${{ github.sha }}
          path: |
            releases/dist/*
            !releases/dist/.android-input/**
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Retain unsigned Android handoff separately (not installable)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: antimatter-android-UNSIGNED-NOT-INSTALLABLE-${{ github.sha }}
          path: releases/dist/.android-input/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Retain updater qualification scope
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: antimatter-updater-verification-${{ github.sha }}
          path: ${{ runner.temp }}/updater-verification.json
          if-no-files-found: error
          retention-days: 14
      # Publication is a separate reviewed action; this job has no write token,
      # Android signing material, package signing credentials, or publish step.
